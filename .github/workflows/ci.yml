name: CI

# Builds ReceiveMIDI and its unit-test suite on macOS, Linux and Windows, then
# runs the tests and smoke-checks the binary. JUCE is vendored under
# JuceLibraryCode/modules, so no framework needs to be fetched -- the committed
# Projucer build files are used as-is.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS }
          - { os: ubuntu-latest,  name: Linux }
          - { os: windows-latest, name: Windows }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout SendMIDI for the end-to-end tests
        uses: actions/checkout@v5
        with:
          repository: gbevin/SendMIDI
          path: e2e/sendmidi

      # ---------------------------------------------------------------- macOS
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          xcodebuild -project Builds/MacOSX/receivemidi.xcodeproj \
            -target "receivemidi - ConsoleApp" -configuration Release SYMROOT=build build
          xcodebuild -project Tests/Builds/MacOSX/ReceiveMIDITests.xcodeproj \
            -target "ReceiveMIDITests - ConsoleApp" -configuration Release SYMROOT=build build

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: ./Tests/Builds/MacOSX/build/Release/ReceiveMIDITests

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./Builds/MacOSX/build/Release/receivemidi --version | grep -q "receivemidi v"

      - name: Build the other tools for the end-to-end tests (macOS)
        if: runner.os == 'macOS'
        run: |
          xcodebuild -project e2e/sendmidi/Builds/MacOSX/sendmidi.xcodeproj \
            -target "sendmidi - ConsoleApp" -configuration Release SYMROOT=build build

      - name: End-to-end test (macOS)
        if: runner.os == 'macOS'
        # drives the built binary through virtual MIDI ports together with the
        # other tools, built from their current sources
        run: |
          ./Scripts/e2e-test.sh ./Builds/MacOSX/build/Release/receivemidi \
            e2e/sendmidi/Builds/MacOSX/build/Release/sendmidi

      # ---------------------------------------------------------------- Linux
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Enable the ALSA sequencer (Linux)
        if: runner.os == 'Linux'
        # the runners have no sound hardware; the sequencer module alone is what
        # virtual MIDI ports need
        run: |
          sudo modprobe snd-seq 2>/dev/null || true
          if [ ! -c /dev/snd/seq ]; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo depmod -a
            sudo modprobe snd-seq || true
          fi
          if [ ! -c /dev/snd/seq ]; then
            echo "no sequencer device; kernel configuration:"
            grep -E "CONFIG_SOUND|CONFIG_SND=|CONFIG_SND_SEQ" "/boot/config-$(uname -r)" || true
            grep -c snd "/lib/modules/$(uname -r)/modules.builtin" || true
            ls -la /dev/snd 2>&1 || true
            exit 1
          fi
          sudo chmod 666 /dev/snd/seq

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make -C Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"
          make -C Tests/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: ./Tests/Builds/LinuxMakefile/build/ReceiveMIDITests

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./Builds/LinuxMakefile/build/receivemidi --version | grep -q "receivemidi v"

      - name: Build the other tools for the end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: |
          make -C e2e/sendmidi/Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"

      - name: End-to-end test (Linux)
        if: runner.os == 'Linux'
        run: |
          ./Scripts/e2e-test.sh ./Builds/LinuxMakefile/build/receivemidi \
            e2e/sendmidi/Builds/LinuxMakefile/build/sendmidi

      # -------------------------------------------------------------- Windows
      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          msbuild Builds/VisualStudio2022/receivemidi.sln /m /p:Configuration=Release /p:Platform=x64
          msbuild Tests/Builds/VisualStudio2022/ReceiveMIDITests.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: .\Tests\Builds\VisualStudio2022\x64\Release\ConsoleApp\ReceiveMIDITests.exe

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./Builds/VisualStudio2022/x64/Release/ConsoleApp/receivemidi.exe --version | grep -q "receivemidi v"

      - name: Build the other tools for the end-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: |
          msbuild e2e/sendmidi/Builds/VisualStudio2022/sendmidi.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Install a loopback MIDI port (Windows)
        if: runner.os == 'Windows'
        # the Win32 MIDI API has no virtual ports, so loopMIDI provides them; its
        # ports only exist while its tray application runs and come from the
        # registry, so two are seeded there, with a press of the "+" button of
        # its window as the fallback
        shell: pwsh
        run: |
          winget install --id TobiasErichsen.loopMIDI --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $exe = Get-ChildItem -Path "${env:ProgramFiles}\Tobias Erichsen\loopMIDI\loopMIDI.exe", "${env:ProgramFiles(x86)}\Tobias Erichsen\loopMIDI\loopMIDI.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "loopMIDI.exe was not installed" }
          reg add "HKCU\Software\Tobias Erichsen\loopMIDI\Ports" /v "loopMIDI Port" /t REG_DWORD /d 1 /f | Out-Null
          reg add "HKCU\Software\Tobias Erichsen\loopMIDI\Ports" /v "loopMIDI Port 2" /t REG_DWORD /d 1 /f | Out-Null
          Start-Process -FilePath $exe.FullName
          $port = $null
          foreach ($i in 1..30) {
            Start-Sleep -Milliseconds 500
            $port = & .\e2e\sendmidi\Builds\VisualStudio2022\x64\Release\ConsoleApp\sendmidi.exe list | Where-Object { $_ -match 'loopMIDI' } | Select-Object -First 1
            if ($port) { break }
          }
          if (-not $port) {
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $window = $null
          foreach ($i in 1..40) {
            Start-Sleep -Milliseconds 500
            $window = $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition) | Where-Object { $_.Current.Name -like 'loopMIDI*' } | Select-Object -First 1
            if ($window) { break }
          }
          if (-not $window) { throw "the loopMIDI window did not appear" }
          $plus = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | Where-Object { $_.Current.Name -eq '+' } | Select-Object -First 1
          if (-not $plus) {
            $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | ForEach-Object { "{0} [{1}]" -f $_.Current.Name, $_.Current.ControlType.ProgrammaticName }
            throw "the + button was not found in the loopMIDI window"
          }
          "+ is a {0} with patterns: {1}" -f $plus.Current.ControlType.ProgrammaticName, (($plus.GetSupportedPatterns() | ForEach-Object { $_.ProgrammaticName }) -join ', ')
          Add-Type -Namespace Native -Name Win -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr hWnd); [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, System.UIntPtr extra);'
          [Native.Win]::SetForegroundWindow([System.IntPtr]$window.Current.NativeWindowHandle) | Out-Null
          try {
            $plus.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          } catch {
            try {
              $plus.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern).DoDefaultAction()
            } catch {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $point = $plus.GetClickablePoint()
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]$point.X, [int]$point.Y)
              [Native.Win]::mouse_event(2, 0, 0, 0, [System.UIntPtr]::Zero)
              [Native.Win]::mouse_event(4, 0, 0, 0, [System.UIntPtr]::Zero)
            }
          }
          }
          $port = $null
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            $port = & .\e2e\sendmidi\Builds\VisualStudio2022\x64\Release\ConsoleApp\sendmidi.exe list | Where-Object { $_ -match 'loopMIDI' } | Select-Object -First 1
            if ($port) { break }
          }
          try { reg query "HKCU\Software\Tobias Erichsen\loopMIDI" /s } catch { }
          if (-not $port) { & .\e2e\sendmidi\Builds\VisualStudio2022\x64\Release\ConsoleApp\sendmidi.exe list; throw "no loopMIDI port appeared" }
          "E2E_PORT=$($port.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: End-to-end test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          E2E_TRACE: 1
        run: |
          ./Scripts/e2e-test.sh ./Builds/VisualStudio2022/x64/Release/ConsoleApp/receivemidi.exe \
            e2e/sendmidi/Builds/VisualStudio2022/x64/Release/ConsoleApp/sendmidi.exe
